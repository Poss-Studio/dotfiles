# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  backend:
    global: webengine
  colors.completion.category.fg:
    global: white
  colors.webpage.bg:
    global: white
  colors.webpage.darkmode.enabled:
    global: false
  colors.webpage.darkmode.threshold.background:
    global: 0
  colors.webpage.preferred_color_scheme:
    global: auto
  completion.show:
    global: never
  completion.shrink:
    global: true
  completion.use_best_match:
    global: false
  scrolling.bar:
    global: never
  scrolling.smooth:
    global: true
  statusbar.position:
    global: bottom
  statusbar.show:
    global: always
  tabs.background:
    global: true
  tabs.favicons.scale:
    global: 1.5
  tabs.last_close:
    global: ignore
  tabs.pinned.frozen:
    global: true
  tabs.position:
    global: top
  tabs.select_on_remove:
    global: next
  tabs.show:
    global: always
  url.default_page:
    global: https://cn.bing.com/
  url.searchengines:
    global:
      DEFAULT: https://cn.bing.com/?={}
  url.start_pages:
    global: https://cn.bing.com
  zoom.default:
    global: 100%
